<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UCH Tests</title>
  <style>
    body { font-family: monospace; background: #121212; color: #fff; padding: 20px; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; }
  </style>
</head>
<body>
  <h1>Pure Function Tests</h1>
  <div id="output"></div>

  <script>window.UCH = {};</script>
  <script src="js/pods.js"></script>
  <script src="js/scoring.js"></script>
  <script>
    const output = document.getElementById('output');
    function assert(name, condition) {
      const el = document.createElement('div');
      el.className = condition ? 'pass' : 'fail';
      el.innerText = `[${condition ? 'PASS' : 'FAIL'}] ${name}`;
      output.appendChild(el);
    }

    // -- Test Pods --
    assert("Sizes 3 players", JSON.stringify(UCH.Pods.calculatePodSizes(3).sizes) === '[3]');
    assert("Sizes 4 players", JSON.stringify(UCH.Pods.calculatePodSizes(4).sizes) === '[4]');
    assert("Sizes 5 players (Special)", UCH.Pods.calculatePodSizes(5).sizes[0] === 4 && UCH.Pods.calculatePodSizes(5).sitOuts === 1);
    assert("Sizes 6 players", JSON.stringify(UCH.Pods.calculatePodSizes(6).sizes) === '[3,3]');
    assert("Sizes 7 players", JSON.stringify(UCH.Pods.calculatePodSizes(7).sizes) === '[4,3]');
    assert("Sizes 10 players", JSON.stringify(UCH.Pods.calculatePodSizes(10).sizes) === '[4,3,3]');
    assert("Sizes 13 players", JSON.stringify(UCH.Pods.calculatePodSizes(13).sizes) === '[4,3,3,3]');

    // -- Test Sit-out Rotation --
    const p5 = ['A','B','C','D','E'];
    let history = [];
    let satOut = new Set();
    for(let i=0; i<5; i++) {
      const res = UCH.Pods.generatePods(p5, [], history, i===0);
      history.push({ sitOuts: res.sitOuts });
      satOut.add(res.sitOuts[0]);
    }
    assert("5 Players rotate sit-outs cleanly over 5 heats", satOut.size === 5);

    // -- Test Scoring & Tiebreaks --
    const players = ['A', 'B', 'C'];
    const heats = [
      { locked: true, sitOuts: [], pods: [['A','B','C']], results: { 'A':1, 'B':2, 'C':3 } },
      { locked: true, sitOuts: [], pods: [['A','B','C']], results: { 'A':3, 'B':2, 'C':1 } }
    ];
    // Points: A: 3+1=4, B: 2+2=4, C: 1+3=4. 
    // Wins: A:1, C:1, B:0. (B drops to rank 3)
    // Recent Placement: C got 1st in heat 2, A got 3rd. C wins tiebreak over A.
    // Order should be C (rank 1), A (rank 2), B (rank 3)
    const pts = [3,2,1,0];
    const standings = UCH.Scoring.calculateStandings(players, heats, pts, 1.5);
    
    assert("Tiebreak logic (Total -> Wins -> Recent)", 
      standings[0].name === 'C' && standings[1].name === 'A' && standings[2].name === 'B');

  </script>
</body>
</html>
