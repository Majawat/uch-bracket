<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UCH Tests</title>
  <style>
    body { font-family: monospace; background: #121212; color: #fff; padding: 20px; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; }
  </style>
</head>
<body>
  <h1>Pure Function Tests</h1>
  <div id="output"></div>

  <script>window.UCH = {};</script>
  <script src="js/pods.js"></script>
  <script src="js/scoring.js"></script>
  <script>
    const output = document.getElementById('output');
    function assert(name, condition) {
      const el = document.createElement('div');
      el.className = condition ? 'pass' : 'fail';
      el.innerText = `[${condition ? 'PASS' : 'FAIL'}] ${name}`;
      output.appendChild(el);
    }

    // -- Test Pods --
    assert("Sizes 3 players", JSON.stringify(UCH.Pods.calculatePodSizes(3).sizes) === '[3]');
    assert("Sizes 4 players", JSON.stringify(UCH.Pods.calculatePodSizes(4).sizes) === '[4]');
    assert("Sizes 5 players (Special)", UCH.Pods.calculatePodSizes(5).sizes[0] === 4 && UCH.Pods.calculatePodSizes(5).sitOuts === 1);
    assert("Sizes 6 players", JSON.stringify(UCH.Pods.calculatePodSizes(6).sizes) === '[3,3]');
    assert("Sizes 7 players", JSON.stringify(UCH.Pods.calculatePodSizes(7).sizes) === '[4,3]');
    assert("Sizes 10 players", JSON.stringify(UCH.Pods.calculatePodSizes(10).sizes) === '[4,3,3]');
    assert("Sizes 13 players", JSON.stringify(UCH.Pods.calculatePodSizes(13).sizes) === '[4,3,3,3]');

    // -- Test Sit-out Rotation --
    const p5 = ['A','B','C','D','E'];
    let history = [];
    let satOut = new Set();
    for(let i=0; i<5; i++) {
      const res = UCH.Pods.generatePods(p5, [], history, i===0);
      history.push({ sitOuts: res.sitOuts, pods: res.pods });
      satOut.add(res.sitOuts[0]);
    }
    assert("5 Players rotate sit-outs cleanly over 5 heats", satOut.size === 5);

    // -- Test Scoring & Tiebreaks --
    const players = ['A', 'B', 'C'];
    const heats = [
      { locked: true, sitOuts: [], pods: [['A','B','C']], results: { 'A':1, 'B':2, 'C':3 } },
      { locked: true, sitOuts: [], pods: [['A','B','C']], results: { 'A':3, 'B':2, 'C':1 } }
    ];
    // 3-player lobby points: 3, 1.5, 0
    // Points: A: 3+0=3, B: 1.5+1.5=3, C: 0+3=3. 
    // Wins: A:1, C:1, B:0. (B drops to rank 3)
    // Recent Placement: C got 1st in heat 2, A got 3rd. C wins tiebreak over A.
    // Order should be C (rank 1), A (rank 2), B (rank 3)
    const pts = { 3: [3,1.5,0], 4: [3,2,1,0] };
    const standings = UCH.Scoring.calculateStandings(players, heats, pts, 1.5);
    
    assert("Tiebreak logic (Total -> Wins -> Recent)", 
      standings[0].name === 'C' && standings[1].name === 'A' && standings[2].name === 'B');

    // -- Fair points by lobby size --
    const avg = t => t.reduce((a,b)=>a+b,0) / t.length;
    assert("Default 3- and 4-player lobbies average the same points", avg(pts[3]) === avg(pts[4]));
    const mixed = UCH.Scoring.calculateStandings(['A','B','C','D','E','F','G'],
      [{ locked: true, sitOuts: [], pods: [['A','B','C','D'],['E','F','G']], results: {A:1,B:2,C:3,D:4,E:1,F:2,G:3} }], pts, 1.5);
    const tot = n => mixed.find(s => s.name === n).total;
    assert("Points use the lobby's own table", tot('B') === 2 && tot('F') === 1.5 && tot('G') === 0);

    // -- Roster changes don't crash or misalign --
    const h4 = [
      { locked: true, sitOuts: [], pods: [['A','B','C','D']], results: {A:1,B:2,C:3,D:4} },
      { locked: true, sitOuts: [], pods: [['A','B'],['C','E','F']], results: {A:1,B:2,C:1,E:2,F:3} }
    ];
    let crashed = false, st2;
    try { st2 = UCH.Scoring.calculateStandings(['A','B','C','E','F'], h4, pts, 1.5); } catch (e) { crashed = true; }
    assert("Player missing from roster doesn't crash standings", !crashed);
    assert("Late joiner history is aligned (null for missed heat)",
      !crashed && JSON.stringify(st2.find(s => s.name === 'E').history) === '[null,2]');

    // -- Pod generation --
    const twelve = 'ABCDEFGHIJKL'.split('');
    const fakeStandings = twelve.map((n, i) => ({ name: n, total: 12 - i, rank: i + 1 }));
    let spreadSum = 0;
    const trials = 200;
    for (let t = 0; t < trials; t++) {
      const g = UCH.Pods.generatePods(twelve, fakeStandings, [], false, 'skewed');
      const flat = g.pods.flat();
      if (flat.length !== 12 || new Set(flat).size !== 12) { spreadSum = NaN; break; }
      g.pods.forEach(pod => { const r = pod.map(p => twelve.indexOf(p)); spreadSum += Math.max(...r) - Math.min(...r); });
    }
    let randSpread = 0;
    for (let t = 0; t < trials; t++) {
      UCH.Pods.generatePods(twelve, fakeStandings, [], false, 'random').pods.forEach(pod => {
        const r = pod.map(p => twelve.indexOf(p)); randSpread += Math.max(...r) - Math.min(...r);
      });
    }
    assert("Every player placed exactly once", !Number.isNaN(spreadSum));
    assert("Skewed lobbies group closer ranks than random", spreadSum < randSpread * 0.75);

    // 8 players, 1 prior heat of [ABCD][EFGH]: the fewest possible rematches is a 2+2 mix in each lobby
    const eight = 'ABCDEFGH'.split('');
    const prev = [{ sitOuts: [], pods: [['A','B','C','D'],['E','F','G','H']] }];
    let allMixed = true;
    for (let t = 0; t < 50; t++) {
      UCH.Pods.generatePods(eight, [], prev, false, 'random').pods.forEach(pod => {
        if (pod.filter(p => 'ABCD'.includes(p)).length !== 2) allMixed = false;
      });
    }
    assert("Minimizes repeat opponents", allMixed);

    const hosted = UCH.Pods.generatePods(['A','B','C','D'], [], [{ sitOuts: [], pods: [['A','B','C','D']] }], false, 'random');
    assert("Previous host doesn't host again", hosted.pods[0][0] !== 'A');

  </script>
</body>
</html>
